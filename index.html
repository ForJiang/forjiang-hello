<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hello — ForJiang</title>
    <meta name="description" content="Apple Hello 手写描边动画演示。" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 背景：体素地形网格（原生 JS 复刻，见 assets/voxel-background.js） -->
    <canvas id="voxel-bg" aria-hidden="true"></canvas>

    <main class="stage">
      <!-- hello 手写动画由 main.js 依据 hello-data.js 渲染 -->
      <svg
        id="hello-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 638 200"
        fill="none"
        stroke="currentColor"
        shape-rendering="geometricPrecision"
        role="img"
        aria-label="hello"
      >
        <title>hello</title>
      </svg>
    </main>

    <div class="dock" id="dock" aria-hidden="true">
      <button class="pill" id="replay" type="button">↻ Replay</button>
      <p class="hint">Click anywhere or press R to replay · © 2026 ForJiang</p>
    </div>

    <noscript>
      <style>
        .dock { display: none; }
      </style>
      <p class="noscript-fallback">hello</p>
    </noscript>

    <script src="assets/voxel-background.js" defer></script>
    <script src="assets/hello-data.js"></script>
    <script src="assets/main.js" defer></script>
  </body>
</html>

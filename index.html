<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hello — ForJiang</title>
    <meta name="description" content="Apple Hello hand-drawn stroke animation over a voxel topography grid." />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background: voxel topography grid (vanilla JS port, see assets/voxel-background.js) -->
    <canvas id="voxel-bg" aria-hidden="true"></canvas>

    <main class="stage">
      <!-- The hello handwriting is rendered by main.js from hello-data.js -->
      <svg
        id="hello-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 638 200"
        fill="none"
        stroke="currentColor"
        shape-rendering="geometricPrecision"
        role="img"
        aria-label="hello"
      >
        <title>hello</title>
      </svg>
    </main>

    <!-- Live clock below the wordmark; same white glow treatment as hello -->
    <div class="clock" id="clock" aria-hidden="true">
      <span class="clock-time" id="clock-time">--:--:--</span>
      <span class="clock-date" id="clock-date"></span>
    </div>

    <!-- Hovering the signature reveals the fullscreen control; its fill
         animation ports the OriginButton reference (pointer-origin circle) -->
    <div class="bottom" id="bottom">
      <button class="fs-btn" id="fs-btn" type="button">
        <span class="fs-fill" id="fs-fill" aria-hidden="true"></span>
        <span class="fs-label" id="fs-label">Fullscreen</span>
      </button>
      <p class="credit" id="credit">© 2026 ForJiang</p>
    </div>

    <noscript>
      <style>
        .clock { display: none; }
        .bottom { opacity: 1; pointer-events: none; }
        .credit { opacity: 0.75; }
      </style>
      <p class="noscript-fallback">hello</p>
    </noscript>

    <script src="assets/voxel-background.js" defer></script>
    <script src="assets/hello-data.js"></script>
    <script src="assets/main.js" defer></script>
  </body>
</html>

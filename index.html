<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hello — ForJiang</title>
    <meta name="description" content="Apple Hello hand-drawn stroke animation over a voxel topography grid." />
    <!-- No theme-color on purpose: Safari tints its chrome frame (status bar
         strip + the iOS 26 floating address-bar zone) with it, which paints
         opaque black bars over the terrain that extends under the chrome.
         color-scheme keeps the derived chrome appearance dark instead. -->
    <meta name="color-scheme" content="dark" />
    <!-- Installed-web-app mode: opened from the home screen the page runs
         without any browser chrome, and black-translucent floats the iOS
         status bar over the page so the terrain shows behind it -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="hello" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="style.css?v=5" />
  </head>
  <body>
    <!-- Background: voxel topography grid (vanilla JS port, see assets/voxel-background.js) -->
    <canvas id="voxel-bg" aria-hidden="true"></canvas>

    <main class="stage">
      <!-- The hello handwriting is rendered by main.js from hello-data.js -->
      <svg
        id="hello-svg"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 638 200"
        fill="none"
        stroke="currentColor"
        shape-rendering="geometricPrecision"
        role="img"
        aria-label="hello"
      >
        <title>hello</title>
      </svg>
    </main>

    <!-- Live clock below the wordmark; same white glow treatment as hello -->
    <div class="clock" id="clock" aria-hidden="true">
      <span class="clock-time" id="clock-time">--:--:--</span>
      <span class="clock-date" id="clock-date"></span>
    </div>

    <!-- Hovering the signature reveals the fullscreen control; its fill
         animation ports the OriginButton reference (pointer-origin circle) -->
    <div class="bottom" id="bottom">
      <button class="fs-btn" id="fs-btn" type="button">
        <span class="fs-fill" id="fs-fill" aria-hidden="true"></span>
        <span class="fs-label" id="fs-label">Fullscreen</span>
      </button>
      <p class="credit" id="credit">© 2026 ForJiang</p>
    </div>

    <noscript>
      <style>
        .clock { display: none; }
        .bottom { opacity: 1; pointer-events: none; }
        .credit { opacity: 0.75; }
      </style>
      <p class="noscript-fallback">hello</p>
    </noscript>

    <script src="assets/voxel-background.js?v=5" defer></script>
    <script src="assets/hello-data.js?v=5" defer></script>
    <script src="assets/main.js?v=5" defer></script>
  </body>
</html>
